<link rel="stylesheet" href="css/card.css">

<div class="cmp-home">
  <h2 class="card-title">主页</h2>

  <div class="card-grid">
    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/network.svg" alt="" style="width:24px; height:24px;">
        <span>网络信息</span>
      </h3>
      <p><b>网络接口：</b><span id="home-network-interface">-</span></p>
      <p><b>IPv4地址：</b><span id="home-network-ip4">-</span></p>
      <p><b>IPv6地址：</b><span id="home-network-ip6">-</span></p>
    </div>

    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/video.svg" alt="" style="width:24px; height:24px;">
        <span>图像采集</span>
      </h3>
      <p><b>图像宽度：</b><span id="home-capture-width">-</span></p>
      <p><b>图像高度：</b><span id="home-capture-height">-</span></p>
      <p><b>视频帧率：</b><span id="home-capture-fps">-</span></p>
    </div>
  </div>

  <div class="card-grid"> 
    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/live.svg" alt="" style="width:24px; height:24px;">
        <span>直播推流</span>
      </h3>
      <p><b>连接状态：</b><span id="home-live-connect">-</span></p>
      <p><b>推流状态：</b><span id="home-live-status">-</span></p>
      <p><b>推流地址：</b><span id="home-live-url">-</span></p>
    </div>

    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/replay.svg" alt="" style="width:18px; height:18px;">
        <span>回放推流</span>
      </h3>
      <p><b>连接状态：</b><span id="home-replay-connect">-</span></p>
      <p><b>推流状态：</b><span id="home-replay-status">-</span></p>
      <p><b>推流地址：</b><span id="home-replay-url">-</span></p>
    </div>
  </div>

  <div class="card-grid"> 
    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/memory.svg" alt="" style="width:24px; height:24px;">
        <span>内存信息</span>
      </h3>
      <p><b>总大小：</b><span id="home-memory-total">-</span></p>
      <p><b>可用大小：</b><span id="home-memory-free">-</span></p>
      <p><b>已用大小：</b><span id="home-memory-used">-</span></p>
    </div>

    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/disk.svg" alt="" style="width:18px; height:18px;">
        <span>磁盘信息</span>
      </h3>
      <p><b>总大小：</b><span id="home-disk-total">-</span></p>
      <p><b>可用大小：</b><span id="home-disk-free">-</span></p>
      <p><b>已用大小：</b><span id="home-disk-used">-</span></p>
    </div>
  </div>

  <div class="card-grid"> 
    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/device.svg" alt="" style="width:18px; height:18px;">
        <span>设备信息</span>
      </h3>
      <p><b>设备ID：</b><span id="home-device-key">-</span></p>
      <p><b>固件名称：</b><span id="home-device-name">-</span></p>
      <p><b>固件版本：</b><span id="home-device-version">-</span></p>
    </div>

    <div class="sub-card">
      <h3 class="card-title">
        <img class="title-icon" src="icons/home/cpu.svg" alt="" style="width:18px; height:18px;">
        <span>处理器信息</span>
      </h3>
      <p><b>负载：</b><span id="home-cpu-load">-</span></p>
      <p><b>运行时间：</b><span id="home-cpu-time">-</span></p>
      <p><b>温度：</b><span id="home-cpu-temp">-</span></p>
    </div>
  </div>
</div>
