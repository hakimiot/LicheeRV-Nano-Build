<div class="cmp-settings">
  <h2>设置</h2>
  <div class="card">
    <label>设备名称
      <input id="cfg-name" type="text">
    </label>
    <label>采样周期 (ms)
      <input id="cfg-interval" type="number" min="10">
    </label>
    <div class="actions">
      <button id="cfg-save" class="primary">保存</button>
      <button id="cfg-reset" class="danger">恢复出厂设置</button>
    </div>
  </div>
</div>
