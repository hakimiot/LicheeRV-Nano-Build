<link rel="stylesheet" href="css/card.css">
<style>
  /* ---------- WLAN 卡片列表 ---------- */
  .cmp-wlan .wlan-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }

  .cmp-wlan .wlan-item {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    margin: 0;
    width: 100%;
    box-sizing: border-box;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    transition: box-shadow 0.15s, border-color 0.15s, transform 0.05s;
  }

  .cmp-wlan .wlan-item:hover {
    border-color: #cbd5e1;
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
  }

  .cmp-wlan .wlan-item.is-connected {
    background: linear-gradient(135deg, #f0f7ff 0%, #e6f0ff 100%);
    border-color: #93c5fd;
  }

  .cmp-wlan .wlan-icon {
    width: 26px !important;
    height: 26px !important;
    flex: 0 0 26px !important;
    object-fit: contain;
  }

  .cmp-wlan .wlan-ssid {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 14px;
    font-weight: 500;
    color: #1e293b;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cmp-wlan .wlan-tag.open {
    flex: 0 0 auto;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 10px;
    background: #fef3c7;
    color: #92400e;
  }

  /* ---------- 连接按钮 ---------- */
  .cmp-wlan .wlan-btn {
    flex: 0 0 auto;
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 500;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.15s, background 0.15s, color 0.15s;
  }

  .cmp-wlan .wlan-btn.connect {
    background: #3b82f6;
    color: #ffffff;
  }

  .cmp-wlan .wlan-btn.connect:hover {
    filter: brightness(1.08);
  }

  .cmp-wlan .wlan-btn.connect:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .cmp-wlan .wlan-btn.connected {
    background: #e2e8f0;
    color: #64748b;
    cursor: default;
  }

  /* ---------- 刷新按钮 ---------- */
  .cmp-wlan .wlan-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }

  .cmp-wlan .wlan-refresh {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    color: #ffffff;
    background: #0ea5e9;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.15s, opacity 0.15s;
  }

  .cmp-wlan .wlan-refresh:hover {
    filter: brightness(1.08);
  }

  .cmp-wlan .wlan-refresh:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .cmp-wlan .wlan-refresh svg {
    width: 14px;
    height: 14px;
  }

  .cmp-wlan .wlan-refresh.loading svg {
    animation: wlan-spin 0.8s linear infinite;
  }

  @keyframes wlan-spin {
    to { transform: rotate(360deg); }
  }

  .cmp-wlan .wlan-empty {
    padding: 24px 0;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
  }
</style>

<div class="cmp-wlan">
  <h2 class="card-title">
    <img class="title-icon" src="icons/wlan/wifi-5.svg" alt="" style="width:18px;height:18px;">
    <span>WLAN</span>
  </h2>

  <div class="wlan-toolbar">
    <button id="wlan-refresh" class="wlan-refresh">
      <span>刷新</span>
    </button>
  </div>

  <div id="wlan-list" class="wlan-list"></div>
</div>
